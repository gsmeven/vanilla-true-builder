name: Build & Publish Release
run-name: Build Standalone Release ${{ github.event.release.tag_name }}

# Pipeline trigger specifications
on:
  release:
    types: [published]
  workflow_dispatch:

# Repository token permissions for release asset publishing
permissions:
  contents: write

jobs:
  build-windows:
    # Target execution host for native Win32/x64 toolchains
    runs-on: windows-latest

    steps:
      # Synchronize repository workspace
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Runtime environment setup with pip package caching
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Build packaging and asset processing dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      # Inject release tag into version.py prior to executable compilation
      - name: Inject Release Version
        shell: pwsh
        run: |
          $ver = "${{ github.event.release.tag_name }}"
          if (-not $ver) {
            $ver = "v1.8.3"
          }
          if (-not $ver.StartsWith("v")) {
            $ver = "v" + $ver
          }
          Write-Host "Compiling version: $ver"
          "APP_VERSION = '$ver'" | Out-File -FilePath "version.py" -Encoding utf8

      # Compile single-file executable with embedded assets and dynamic imports
      - name: Build Standalone Executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "VanillaTrueBuilder" `
            --icon "rakuzan.ico" `
            --add-data "rakuzan.ico;." `
            --add-data "preview.jpg;." `
            --hidden-import "auditor" `
            --hidden-import "version" `
            main.py

      # Assemble distribution directory and generate compressed zip archive
      - name: Package VanillaTrueBuilder.zip
        shell: pwsh
        run: |
          $folderName = "VanillaTrueBuilder"
          New-Item -ItemType Directory -Path $folderName -Force | Out-Null

          Copy-Item "dist/VanillaTrueBuilder.exe" -Destination "$folderName/" -Force

          if (Test-Path "ai_context.md") {
            Copy-Item "ai_context.md" -Destination "$folderName/" -Force
          }

          if (Test-Path "overrides") {
            Copy-Item "overrides" -Destination "$folderName/overrides" -Recurse -Force
          } else {
            New-Item -ItemType Directory -Path "$folderName/overrides" -Force | Out-Null
          }

          Compress-Archive -Path $folderName -DestinationPath "VanillaTrueBuilder.zip" -Force

      # Generate cryptographic SHA-256 hash for binary integrity validation
      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "VanillaTrueBuilder.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  VanillaTrueBuilder.zip" | Out-File -FilePath "checksums.txt" -Encoding ascii
          Write-Host "SHA-256: $hash"

      # Attach distribution archive and checksum directly to the published release
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VanillaTrueBuilder.zip
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
