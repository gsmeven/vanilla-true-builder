name: Build & Publish Release
run-name: Build & Publish Release #${{ github.run_number }} by @${{ github.actor }}

# Pipeline triggers
on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'ai_context.md'
      - 'overrides/**'
      - 'preview.jpg'
      - 'rakuzan.ico'
  workflow_dispatch:

# Target repository write permissions for releases
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Runtime setup with dependency caching
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Install packaging toolchains
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      # Parse canonical application version for release tagging
      - name: Extract Project Version
        id: get_version
        shell: pwsh
        run: |
          $ver = "v1.8.3"
          if (Test-Path "main.py") {
            $match = Select-String -Path "main.py" -Pattern 'APP_VERSION\s*=\s*["'']([^"'']+)["'']'
            if ($match -and $match.Matches.Groups[1].Value) {
              $ver = $match.Matches.Groups[1].Value.Trim()
            }
          }
          if (-not $ver.StartsWith("v")) { $ver = "v" + $ver }
          Write-Host "Target Release Version: $ver"
          "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Compile single-file executable with embedded assets and imports
      - name: Build Standalone Executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "VanillaTrueBuilder" `
            --icon "rakuzan.ico" `
            --add-data "rakuzan.ico;." `
            --add-data "preview.jpg;." `
            --hidden-import "auditor" `
            main.py

      # Assemble distribution directory and generate zip archive
      - name: Package VanillaTrueBuilder.zip
        shell: pwsh
        run: |
          $folderName = "VanillaTrueBuilder"
          New-Item -ItemType Directory -Path $folderName -Force | Out-Null

          Copy-Item "dist/VanillaTrueBuilder.exe" -Destination "$folderName/" -Force

          if (Test-Path "ai_context.md") {
            Copy-Item "ai_context.md" -Destination "$folderName/" -Force
          }

          if (Test-Path "overrides") {
            Copy-Item "overrides" -Destination "$folderName/overrides" -Recurse -Force
          } else {
            New-Item -ItemType Directory -Path "$folderName/overrides" -Force | Out-Null
          }

          Compress-Archive -Path $folderName -DestinationPath "VanillaTrueBuilder.zip" -Force

      # Generate cryptographic checksum for release verification
      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "VanillaTrueBuilder.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  VanillaTrueBuilder.zip" | Out-File -FilePath "checksums.txt" -Encoding ascii
          Write-Host "SHA-256: $hash"

      # Publish artifacts to GitHub Releases
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: "Vanilla True Builder ${{ env.RELEASE_VERSION }}"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            #### ⚡️ Quick Installation:
            1. Download and extract **`VanillaTrueBuilder.zip`** below.
            2. Run **`VanillaTrueBuilder.exe`**.
            3. Select your desired restoration modules (or **Select All**) and click **`BUILD PACKAGE (.FANTOME)`**.
            4. Drag the generated **`VanillaTrueMod.fantome`** into [**LTK Manager**](https://github.com/LeagueToolkit) and enable it!

            ---

            #### 📦 Package Contents:
            * **`VanillaTrueBuilder.exe`** - Main + Auditor (**`SKIN FIX`**).
            * **`ai_context.md`** - Prompt engineering context for AI skin curation.
            * **`overrides/`** - Curated native engine templates for complex skins.
          files: |
            VanillaTrueBuilder.zip
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
